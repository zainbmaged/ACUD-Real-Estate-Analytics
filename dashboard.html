<style>
/* =====================================================================
   BRAND THEME  -  colours taken from the official ACUD logo:
   red #ED1C24 (the "A" and "U" strokes), black #000 / near-black (the "C" and "D"), white.
   Edit only this block to restyle everything.
   ===================================================================== */
:root{
  --brand:#ED1C24;        /* ACUD red: active tab underline, buttons, links, header rule */
  --brand-ink:#ffffff;    /* text on brand colour */
  --accent:#111111;       /* ACUD black */
  --bg:#f4f4f5; --surface:#ffffff; --surface2:#fafafa;
  --ink:#111111; --ink2:#4a4a50; --muted:#7a7a82; --line:#e4e4e7;
  --s1:#ED1C24; --s2:#111111; --s3:#8a8a92; --s4:#a5121a; --s5:#f48a8e;   /* chart series: red, black, grey, dark red, light red */
  --good:#1a7f4b; --warn:#a86a00; --crit:#c4161c; --good-bg:#e6f4ec; --warn-bg:#fff3dc; --crit-bg:#fdeaea;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#f0343b; --brand-ink:#ffffff; --accent:#f4f4f5;
  --bg:#0c0c0d; --surface:#171718; --surface2:#1e1e20; --ink:#f4f4f5; --ink2:#c4c4ca; --muted:#8e8e96; --line:#2c2c30;
  --s1:#f0343b; --s2:#f4f4f5; --s3:#8e8e96; --s4:#c2272d; --s5:#f7a1a4;
  --good:#4cc38a; --warn:#e8a93d; --crit:#f26a70; --good-bg:#13301f; --warn-bg:#33270f; --crit-bg:#3d1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --brand:#f0343b; --brand-ink:#ffffff; --accent:#f4f4f5;
  --bg:#0c0c0d; --surface:#171718; --surface2:#1e1e20; --ink:#f4f4f5; --ink2:#c4c4ca; --muted:#8e8e96; --line:#2c2c30;
  --s1:#f0343b; --s2:#f4f4f5; --s3:#8e8e96; --s4:#c2272d; --s5:#f7a1a4;
  --good:#4cc38a; --warn:#e8a93d; --crit:#f26a70; --good-bg:#13301f; --warn-bg:#33270f; --crit-bg:#3d1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark;}
/* ===================================================================== */
*{box-sizing:border-box}
a{color:var(--brand)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;line-height:1.6;font-size:15px}
[lang=en] body{font-family:"Segoe UI",Inter,Arial,sans-serif}
header.top{background:var(--surface);color:var(--ink);border-bottom:3px solid var(--brand);box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.top-in{max-width:1280px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none}
.logo b{display:block;font-size:1.02rem;line-height:1.25}
.logo small{display:block;color:var(--ink2);font-size:.76rem;line-height:1.3}
.sp{flex:1}
.ctl{display:flex;gap:8px;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 12px;border-radius:8px;cursor:pointer;min-height:34px}
.btn:hover{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
nav.tabs{max-width:1280px;margin:auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font:inherit;color:var(--ink2);background:transparent;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:700}
nav.tabs button:hover{color:var(--brand)}
.logo-img{height:60px;max-width:220px;width:auto;display:block;object-fit:contain;background:#fff;border-radius:8px;padding:3px 8px;box-shadow:0 0 0 1px var(--line)}
.urbansight-logo{max-width:260px}
@media(max-width:640px){.logo-img{height:46px;max-width:145px}.urbansight-logo{max-width:165px}}
main{max-width:1280px;margin:auto;padding:16px 16px 60px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.84rem;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:.78rem;color:var(--ink2)}
.kpi .v{font-size:1.5rem;font-weight:700;line-height:1.25;margin-top:2px}
.kpi .h{font-size:.72rem;color:var(--muted)}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:.98rem}
.card h3 small{font-weight:400;color:var(--muted);font-size:.78rem}
.sub{color:var(--ink2);font-size:.85rem}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
label.f{display:flex;flex-direction:column;font-size:.78rem;color:var(--ink2);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);min-width:130px;max-width:100%}
textarea{width:100%;min-height:64px}
button.go{font:inherit;background:var(--brand);color:var(--brand-ink);border:0;padding:8px 18px;border-radius:8px;cursor:pointer;min-height:36px}
button.go:disabled{opacity:.55}
button.ghost{font:inherit;background:transparent;color:var(--brand);border:1px solid var(--brand);padding:6px 12px;border-radius:8px;cursor:pointer}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:start;white-space:nowrap}
th{color:var(--ink2);font-weight:600;cursor:pointer;user-select:none;background:var(--surface2);position:sticky;top:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.74rem;border:1px solid var(--line);background:var(--surface2)}
.pill.good{color:var(--good);background:var(--good-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.pill.crit{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(80px,170px) 1fr auto;gap:8px;align-items:center;font-size:.82rem}
.brow .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.track{background:var(--surface2);border-radius:6px;height:14px;overflow:hidden;display:flex}
.fill{height:100%;border-radius:0 5px 5px 0}
[dir=rtl] .fill{border-radius:5px 0 0 5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}
svg.chart{width:100%;height:auto;display:block;direction:ltr;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
svg.chart .grid line{stroke:var(--line)}
svg.chart .hit .x{stroke:var(--ink2);stroke-width:1;opacity:0}
svg.chart .hit:hover .x{opacity:.55}
svg.chart .hit rect{fill:transparent}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.78rem;max-width:300px;display:none;box-shadow:var(--shadow);line-height:1.5}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--brand);font-size:.8rem}
ul.l{margin:0;padding-inline-start:20px}
ul.l li{margin-bottom:3px}
.summary{background:var(--good-bg);color:var(--ink);border-inline-start:4px solid var(--good);border-radius:8px;padding:10px 14px;font-weight:600;margin-bottom:12px}
.callout{background:var(--warn-bg);border-inline-start:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sub-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sub-tabs button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
.sub-tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(640px,100%);background:var(--bg);border-inline-start:1px solid var(--line);z-index:40;overflow:auto;padding:16px;box-shadow:var(--shadow);transform:translateX(0)}
.drawer .x{float:inline-end}
.hm td{text-align:center;min-width:54px}
.err{color:var(--crit)}
.loading{color:var(--muted);padding:30px;text-align:center}
@media (max-width:640px){.kpi .v{font-size:1.25rem}.brow{grid-template-columns:90px 1fr auto}}
@media print{header.top .ctl,nav.tabs{display:none}}
</style>
</head>

async function api(path, opt) {

  const r = await fetch(API + path, opt);
  if (!r.ok) { let d = r.status; try { d = (await r.json()).detail || d; } catch (e) {} throw new Error(d); }
  const j = await r.json();
  if (k) S.cache[k] = j;
  return j;
}

/* ---------------------------------------------------------------- tooltip */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth; let x = e.clientX + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14;

});

/* ---------------------------------------------------------------- charts (inline SVG / HTML, no libraries) */
const SER = ["s1", "s2", "s3", "s4", "s5"];
function lineChart(o) {              // o: {labels, series:[{name, values}], fmt, h, zero}
  const W = 720, H = o.h || 220, m = {l: 54, r: 14, t: 12, b: 26}, n = o.labels.length, f = o.fmt || (v => nf(v));
  const all = o.series.flatMap(s => s.values).filter(v => v != null && !isNaN(v));
  if (!all.length) return `<div class="sub">${L("لا توجد بيانات", "No data")}</div>`;
  let lo = o.zero === false ? Math.min(...all) : Math.min(0, ...all), hi = Math.max(...all);
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st; if (hi === lo) hi = lo + st;
  const X = i => m.l + (n === 1 ? 0 : i * (W - m.l - m.r) / (n - 1)), Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  let g = "", ax = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = Y(v); g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/>`; ax += `<text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${f(v)}</text>`; }
  const step = Math.max(1, Math.ceil(n / 8));
  o.labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) ax += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  let paths = "", dots = "";
  o.series.forEach((s, k) => {
    const col = sc(s.color || SER[k % 5]); let d = ""; let pen = false;
    s.values.forEach((v, i) => { if (v == null || isNaN(v)) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    paths += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    let li = s.values.length - 1; while (li > 0 && s.values[li] == null) li--;
    if (s.values[li] != null) dots += `<circle cx="${X(li)}" cy="${Y(s.values[li])}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  let hit = "";
  o.labels.forEach((l, i) => {
    const tp = `<b>${esc(l)}</b>` + o.series.map((s, k) => `<br><span style="color:${sc(s.color || SER[k % 5])}">●</span> ${esc(s.name)}: ${s.values[i] == null ? "—" : f(s.values[i])}`).join("");
    const x0 = n === 1 ? m.l : X(i) - (W - m.l - m.r) / (n - 1) / 2, w = (W - m.l - m.r) / Math.max(n - 1, 1);
    hit += `<g class="hit" data-tip="${esc(tp)}"><line class="x" x1="${X(i)}" x2="${X(i)}" y1="${m.t}" y2="${H - m.b}"/><rect x="${x0}" y="${m.t}" width="${w}" height="${H - m.t - m.b}"/></g>`;
  });
  const leg = o.series.length > 1 ? `<div class="legend">${o.series.map((s, k) => `<span><i style="background:${sc(s.color || SER[k % 5])}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  const rows = o.labels.map((l, i) => `<tr><td>${esc(l)}</td>${o.series.map(s => `<td class="num">${s.values[i] == null ? "—" : f(s.values[i])}</td>`).join("")}</tr>`).join("");
  const tb = `<details><summary>${L("عرض كجدول", "View as table")}</summary><div class="tbl"><table><tr><th></th>${o.series.map(s => `<th>${esc(s.name)}</th>`).join("")}</tr>${rows}</table></div></details>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || "")}"><g class="grid">${g}</g>${ax}${paths}${dots}${hit}</svg>${leg}${tb}`;
}
function barList(items, o = {}) {    // items:[{label, value, color, tip, note}]
  if (!items.length) return `<div class="sub">${L("لا توجد بيانات", "No data")}</div>`;
  const max = o.max || Math.max(...items.map(i => i.value || 0), 1e-9), f = o.fmt || (v => nf(v));
  return `<div class="bars">${items.map(i => `<div class="brow" data-tip="${esc(i.tip || (i.label + ": " + f(i.value)))}"><span class="lb" title="${esc(i.label)}">${esc(i.label)}</span><span class="track"><span class="fill" style="width:${Math.max(0, Math.min(100, (i.value || 0) / max * 100))}%;background:${i.color || sc("s1")}"></span></span><span class="num">${f(i.value)}${i.note ? " " + i.note : ""}</span></div>`).join("")}</div>`;
}
function stacked(parts) {            // component bars 0..100
  return `<div class="bars">${parts.map(p => `<div class="brow"><span class="lb">${esc(p.label)}</span><span class="track"><span class="fill" style="width:${p.value == null ? 0 : p.value}%;background:${p.value == null ? "transparent" : p.value >= 70 ? sc("good") : p.value >= 40 ? sc("s4") : sc("crit")}"></span></span><span class="num">${p.value == null ? L("غير متاح", "n/a") : nf(p.value, 0)}</span></div>`).join("")}</div>`;
}

/* ---------------------------------------------------------------- tables (sortable) */
let TID = 0;
function table(rows, cols, o = {}) {
  if (!rows || !rows.length) return `<div class="sub">${L("لا توجد بيانات", "No data")}</div>`;
  const id = "t" + (++TID); S.tbl[id] = {rows, cols, o, sort: null, dir: 1};
  return `<div class="tbl" id="${id}">${tableInner(id)}</div>`;
}
function tableInner(id) {
  const T = S.tbl[id]; let rows = T.rows.slice();
  if (T.sort) rows.sort((a, b) => { const x = a[T.sort], y = b[T.sort]; return (x == null) - (y == null) || (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * T.dir; });
  const head = T.cols.map(c => `<th data-sort="${c}" title="${L("ترتيب", "Sort")}">${colLabel(c)}${T.sort === c ? (T.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const body = rows.map((r, i) => `<tr class="${T.o.click ? "click" : ""}" ${T.o.click ? `data-row="${i}"` : ""}>${T.cols.map(c => {
    const v = r[c]; let h;
    if (T.o.cell && T.o.cell[c]) h = T.o.cell[c](v, r); else if (v == null) h = "—"; else if (typeof v === "object") h = esc(Array.isArray(v) ? v.join(", ") : JSON.stringify(v)); else h = colFmt(c)(v);
    return `<td class="${typeof v === "number" ? "num" : ""}">${h}</td>`;
  }).join("")}</tr>`).join("");
  T.cur = rows;
  return `<table><tr>${head}</tr>${body}</table>`;
}
document.addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]");
  if (th) { const w = th.closest(".tbl"), T = S.tbl[w.id]; const c = th.dataset.sort; T.dir = T.sort === c ? -T.dir : (typeof T.rows[0][c] === "number" ? -1 : 1); T.sort = c; w.innerHTML = tableInner(w.id); return; }
  const tr = e.target.closest("tr[data-row]");
  if (tr) { const T = S.tbl[tr.closest(".tbl").id]; if (T.o.click) T.o.click(T.cur[+tr.dataset.row]); }
});

function agentParams() {

  if (!R.project) return "";
  const p = R.project, alt = R.alternatives || [], b = R.baseline;
  return `<div class="chips">${pill(riskCls(p.risk_score), L("مخاطرة ", "Risk ") + nf(p.risk_score, 0) + " · " + riskTxt(p.risk_score))}${pill("", L("أشهر المخزون ", "Months of inv. ") + nf(p.months_of_inventory, 0))}<button class="ghost" onclick="openProject('${p.Project_ID}')">${L("فتح المشروع في الداشبورد", "Open project in dashboard")}</button></div>
  ${R.recommendation ? `<div class="callout"><b>${L("التوصية", "Recommendation")}:</b> ${esc(R.recommendation)}</div>` : ""}
  <div class="grid g2">${card(L("الأسباب المحتملة", "Likely causes"), `<ul class="l">${R.likely_causes.map(c => `<li>${esc(c.cause)} ${pill(c.severity === "high" ? "crit" : c.severity === "medium" ? "warn" : "", c.severity === "high" ? L("مرتفع", "high") : c.severity === "medium" ? L("متوسط", "medium") : L("منخفض", "low"))}</li>`).join("")}</ul>`)}
   ${card(L("إجراءات مقترحة", "Suggested actions"), ml(R.suggested_actions))}</div>
  ${alt.length ? card(L("مقارنة البدائل والأثر المالي", "Alternatives & financial impact"), table(([b ? {...b, option: L("الوضع الحالي", "Current state"), velocity_units_per_month: b.velocity_units_per_month} : null].filter(Boolean)).concat(alt), ["option", "months_to_clear", "margin_pct", "net_value_egp", "delta_vs_baseline_egp", "assumed_speed_uplift_pct", "breakeven_speed_uplift_pct", "addresses_cause", "recommended"], {cell: {option: (v, x) => x.recommended ? "<b>" + esc(v) + "</b>" : esc(v), months_to_clear: v => v == null ? L("غير مقاس", "not quantified") : nf(v, 1), net_value_egp: v => v == null ? "—" : mil(v)}}), L("القيمة الحالية بعد خصم الوقت والتسويق؛ المعاملات افتراضات سيناريو", "PV net of time value & marketing; coefficients are scenario assumptions")) : ""}
  ${R.survey && R.survey.top_problems ? card(L("صوت السكان (استبيان الحي)", "Resident voice (district survey)"), barList(Object.entries(R.survey.top_problems).map(([k, v]) => ({label: k, value: v, color: sc("s2")})))) : ""}`;
}

/* ---------------------------------------------------------------- shell */
const TABS = [["overview", "نظرة عامة", "Executive overview"], ["sales", "المبيعات والأداء المالي", "Sales & financial"], ["inventory", "المخزون ومخاطر البيع", "Inventory & risk"],
  ["developers", "أداء المطورين", "Developer performance"], ["city", "الخدمات والسكان", "Smart city"], ["sustain", "الاستدامة", "Sustainability"], ["agents", "وكلاء الذكاء الاصطناعي", "AI agents"]];
function chrome() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme);
  $("#ttl").textContent = L("منصة ذكاء العقارات والتخطيط العمراني", "Real Estate & Urban Intelligence Platform");
  $("#subttl").textContent = L("نظام دعم القرار الاستثماري والتطويري", "Investment & developer decision support");
  $("#bLang").textContent = S.lang === "ar" ? "English" : "العربية";
  const isDark = S.theme === "dark" || (S.theme === "auto" && matchMedia("(prefers-color-scheme:dark)").matches);
  $("#bTheme").textContent = (isDark ? "☀ " : "☾ ") + (isDark ? L("فاتح", "Light") : L("غامق", "Dark"));
  $("#tabs").innerHTML = TABS.map(([k, a, e]) => `<button role="tab" data-k="${k}" class="${k === S.tab ? "on" : ""}">${L(a, e)}</button>`).join("");
  document.title = "ACUD · " + L("منصة ذكاء العقارات", "Real Estate Intelligence");
}
async function render() {
  chrome(); const main = $("#main"); main.innerHTML = `<div class="loading">${L("جاري التحميل…", "Loading…")}</div>`;
  try { main.innerHTML = await PAGES[S.tab](); PAGES[S.tab].after && PAGES[S.tab].after(); }
  catch (e) { main.innerHTML = `<div class="card err">${L("تعذر التحميل: ", "Failed to load: ")}${esc(e.message)}<div class="sub">${L("تأكد أن الـ API شغال: uvicorn api:app --port 8000", "Make sure the API is running: uvicorn api:app --port 8000")}</div></div>`; console.error(e); }
}
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) { S.tab = b.dataset.k; closeDrawer(); render(); } };
$("#bLang").onclick = () => { S.lang = S.lang === "ar" ? "en" : "ar"; try { localStorage.setItem("acud_lang", S.lang); } catch (e) {} S.replayOnce = true; render(); };
$("#bTheme").onclick = () => { const dark = S.theme === "dark" || (S.theme === "auto" && matchMedia("(prefers-color-scheme:dark)").matches); S.theme = dark ? "light" : "dark"; try { localStorage.setItem("acud_theme", S.theme); } catch (e) {} chrome(); };
(async () => { try { S.meta = await api("/meta"); } catch (e) { S.meta = {districts: [], projects: [], developers: [], unit_types: []}; } const h = location.hash.slice(1); if (PAGES[h]) S.tab = h; render(); })();
</script>
</body>
</html>
