<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACUD Resident Service Intelligence</title>
<style>
/* THEME TOKENS: ACUD brand system. Brand red #ED1C24, black and white are the identity; red is a strategic accent only
   (selected navigation, decision, weaker-sales series, top of the heat ramp, focus). Surfaces are tonal charcoal, never pure black.
   Chart pair red/blue validated on the dark surface (dataviz validator: all checks pass). Official logo: assets/acud-logo.png (supplied by the owner; opaque white background, shown as supplied). */
:root{color-scheme:dark;
/* brand */--red:#ED1C24;--red-strong:#D41A21;--red-deep:#8F1F25;--red-text:#FF5A60;--red-tint:rgba(237,28,36,.14);--black:#000000;--white:#FFFFFF;
/* header */--brand-1:#0A0A0B;--brand-2:#1A1B1E;--brand-ink:#F5F5F3;
/* surface hierarchy: app < sidebar < panel < elevated */--bg:#0E0F11;--sidebar:#131417;--surface:#16181B;--elevated:#1F2226;--field-bg:#1B1D21;
/* text: primary / secondary / muted */--ink:#ECECEA;--ink2:#B4B6BA;--muted:#8A8D93;
/* separators */--line:#2A2D32;--axis:#3A3E44;
/* interactive */--nav-active-bg:var(--red-tint);--nav-active-ink:#FFFFFF;--nav-hover:#1B1D21;--focus:#FF5A60;
/* chart series: red = weaker sales position / critical, blue = stronger sales position / primary measure */--s-strong:#3987e5;--s-weak:#ED1C24;
/* insight roles */--ins-obs:#3987e5;--ins-int:#8A8D93;--ins-dec:#ED1C24;
/* status */--warn-bg:#231D12;--warn-line:#4A3B1B;--warn-ink:#E3C688;--err:#FF6B70;
/* blue tints for the pain-point bars */--r100:#cde2fb;--r200:#9ec5f4;--r300:#6da7ec;--r400:#3987e5;--r500:#4a8fd6;--r600:#184f95;--r700:#0d366b;
/* tooltip */--tip-shadow:rgba(0,0,0,.55)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(115deg,var(--brand-1),var(--brand-2));color:var(--brand-ink);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:60px;width:auto;border-radius:6px}header h1{font-size:18px;margin:0;font-weight:650}header p{margin:0;font-size:12px;opacity:.85}
header img.urbansight-logo{margin-left:auto}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 66px)}
nav{background:var(--sidebar);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--ink2);font-weight:550}nav button:hover{background:var(--nav-hover)}
nav button[aria-current=true]{background:var(--nav-active-bg);color:var(--nav-active-ink);box-shadow:inset 3px 0 0 var(--red)}nav button:focus-visible{outline:2px solid var(--focus)}
main{padding:16px 22px 48px;max-width:1240px;width:100%;min-width:0}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field-bg);color:var(--ink)}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:10px 13px;margin:0 0 14px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}.card .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:26px;font-weight:700}.kpi .n{font-size:11px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ins{display:grid;gap:8px}.ins div{padding:9px 12px;border-radius:8px;border-left:4px solid var(--axis);background:var(--bg)}.ins .t{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:block}
.ins .interpretation{border-left-color:var(--ins-int)}.ins .decision{border-left-color:var(--ins-dec)}.ins .observation{border-left-color:var(--ins-obs)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.wrap{overflow:auto}
.pill{display:inline-block;border:1px solid var(--axis);border-radius:99px;padding:2px 9px;font-size:11.5px;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-bottom:6px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline}
svg text{fill:var(--ink2);font:11.5px system-ui,sans-serif}svg .ax{stroke:var(--axis)}svg .gl{stroke:var(--line)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--elevated);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px var(--tip-shadow);max-width:300px;display:none}
.empty{color:var(--muted);padding:14px 0}details{margin-top:8px}summary{cursor:pointer;color:var(--ink2);font-size:12px}
.heat td{text-align:center;font-variant-numeric:tabular-nums;min-width:68px;border:1px solid var(--surface)}.heat th{white-space:normal;min-width:68px}
.view{display:none}.view.on{display:block}.small{font-size:12px;color:var(--muted)}.err{color:var(--err)}
@media(max-width:900px){.shell{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}main{padding:12px}}
</style></head><body>

<div class="shell">

<main>
<div class="filters" role="group" aria-label="Filters">
<label>Area<select id="fArea"><option value="">All areas</option></select></label>
<label>Sales position (derived)<select id="fPos"><option value="">All</option><option value="weaker">Weaker sales position</option><option value="stronger">Stronger sales position</option></select></label>
<label>Service focus<select id="fSvc"><option value="">All services</option></select></label>

<script>
const params=new URLSearchParams(location.search);const API=params.get('api')||'http://127.0.0.1:8000/api/v1/survey-sales';
const VIEWS=[['brief','Executive brief'],['land','Service landscape'],['pain','Resident pain points'],['test','Hypothesis test'],['act','Management actions'],['meth','Methodology']];
const $=id=>document.getElementById(id);let D=null,cur='brief';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>x==null?'n/a':Math.round(x*100)+'%';const pct1=x=>x==null?'n/a':(x*100).toFixed(1)+'%';const num=(x,d=2)=>x==null?'n/a':Number(x).toFixed(d);
const ci=a=>a&&a[0]!=null?`${pct(a[0])}–${pct(a[1])}`:'n/a';
const CLASS={high_priority:['▲','High priority'],medium_priority:['●','Medium priority'],further_investigation:['?','Further investigation required'],monitor:['○','Monitor'],outside_service_scope:['↗','Outside service scope']};
const ACT={investigate_service_deficiency:'Investigate service deficiency',investigate_cause_before_intervention:'Investigate cause before any intervention',investigate_accessibility_or_quality:'Investigate access or quality',review_operational_quality:'Review operational quality',collect_additional_resident_feedback:'Collect more resident feedback',request_commercial_investigation:'Request commercial investigation'};
const GRADE={strong_descriptive:'Strong descriptive',consistent_but_limited:'Consistent but limited',preliminary_association:'Preliminary',weak_or_contradictory:'Weak or contradictory',insufficient_data:'Insufficient data',no_concern_detected:'No concern detected',no_service_explanation_found:'No service explanation found'};
const MARK={strong_descriptive:'●',consistent_but_limited:'◐',preliminary_association:'○',weak_or_contradictory:'△'};
const ramp=['#1F2226','#2E2427','#4A2428','#6B2227','#8F1F25','#B81C22','#D41A21'];
function rampColor(v){const i=Math.max(0,Math.min(ramp.length-1,Math.floor(v/0.5*ramp.length)));return [ramp[i],'#F5F5F3']}
const pill=c=>{const [g,t]=CLASS[c]||['',c];return `<span class="pill">${g} ${esc(t)}</span>`};
const svcLabel=k=>(D.satisfaction_by_service.find(s=>s.service===k)||{}).label_en||k;
/* tooltips */
const tip=$('tip');document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return}tip.innerHTML=t.dataset.tip;tip.style.display='block';const x=Math.min(innerWidth-310,e.clientX+14);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'});
const T=s=>`data-tip="${esc(s)}" tabindex="0"`;
/* nav */
$('nav').innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}" aria-current="${k==='brief'}">${l}</button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.v;[...$('nav').children].forEach(x=>x.setAttribute('aria-current',x.dataset.v===cur));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+cur))};
/* data */
let seq=0;async function load(){const my=++seq;$('status').textContent='Loading…';try{const q=new URLSearchParams();if($('fArea').value)q.set('district_id',$('fArea').value);if($('fPos').value)q.set('sales_position',$('fPos').value);
const r=await fetch(`${API}/executive?${q}`);const d=await r.json();if(!r.ok)throw Error(d.detail||'request failed');if(my!==seq)return;D=d;fillFilters();render();$('status').textContent=`${D.respondents_in_filter} respondents in view`}catch(e){$('status').innerHTML=`<span class="err">Could not load: ${esc(e.message)}. Start the API (see SERVICE_GAP_MODULE.md).</span>`}}
let filled=false;function fillFilters(){if(filled||!D.sales_position)return;filled=true;const ids=Object.keys(D.sales_position.by_district||{}).sort();
$('fArea').innerHTML='<option value="">All areas</option>'+(D.district_points||[]).map(p=>`<option value="${esc(p.district_id)}">${esc(p.district_id)}${p.sales_position?' · '+p.sales_position:''}</option>`).join('');
$('fSvc').innerHTML='<option value="">All services</option>'+D.satisfaction_by_service.map(s=>`<option value="${s.service}">${esc(s.label_en)}</option>`).join('')}
['fArea','fPos'].forEach(i=>$(i).onchange=load);$('fSvc').onchange=()=>D&&render();
const svcOK=k=>!$('fSvc').value||$('fSvc').value===k;
function render(){const b=$('banner');b.style.display='';b.innerHTML=D.data_mode==='synthetic_demonstration'?'<strong>Demonstration data.</strong> Every figure is computed from synthetic records. It demonstrates the method and is not evidence about real residents. Resident feedback is indirect evidence about area attractiveness and cannot explain why non-buyers declined to buy.':'';if(!b.innerHTML)b.style.display='none';
brief();land();pain();test();act();meth()}
/* VIEW 1 */
function dumbbell(){const g=D.group_comparison;if(g.status!=='ok')return `<div class="empty">Group comparison unavailable: ${esc(g.reason||'insufficient data')}.</div>`;
const rows=g.services.filter(s=>s.weaker_mean!=null).sort((a,b)=>(b.weaker_mean+b.stronger_mean)-(a.weaker_mean+a.stronger_mean));const W=720,L=190,R=40,rh=30,top=24,H=top+rows.length*rh+28,max=.5,x=v=>L+v/max*(W-L-R);
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dissatisfied share by service, weaker versus stronger sales position districts">`;
for(let t=0;t<=50;t+=10){s+=`<line class="gl" x1="${x(t/100)}" x2="${x(t/100)}" y1="${top-6}" y2="${H-24}"/><text x="${x(t/100)}" y="${H-8}" text-anchor="middle">${t}%</text>`}
rows.forEach((r,i)=>{const y=top+i*rh+rh/2;const tt=`<b>${esc(r.label_en)}</b><br>Weaker: ${pct(r.weaker_mean)} · Stronger: ${pct(r.stronger_mean)}<br>Difference ${num(r.diff_pp,1)} pp (${esc(r.direction)})<br>Exact p ${r.p_exact}, adjusted q ${r.q_bh}; rank-biserial ${r.rank_biserial}<br>Districts: ${r.weaker_districts_n} weaker vs ${r.stronger_districts_n} stronger`;
s+=`<g ${T(tt)}><rect x="0" y="${y-rh/2}" width="${W}" height="${rh}" fill="transparent"/><text x="${L-10}" y="${y+4}" text-anchor="end">${esc(r.label_en)}</text><line x1="${x(r.stronger_mean)}" x2="${x(r.weaker_mean)}" y1="${y}" y2="${y}" stroke="var(--axis)" stroke-width="2"/>
<circle cx="${x(r.stronger_mean)}" cy="${y}" r="6" fill="var(--s-strong)" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(r.weaker_mean)}" cy="${y}" r="6" fill="var(--s-weak)" stroke="var(--surface)" stroke-width="2"/>${r.supported?`<text x="${W-R+6}" y="${y+4}">★</text>`:''}</g>`});
s+='</svg>';return `<div class="legend"><span><i class="dot" style="background:var(--s-weak)"></i>Weaker-selling districts (${g.weaker_districts.length})</span><span><i class="dot" style="background:var(--s-strong)"></i>Stronger-selling districts (${g.stronger_districts.length})</span><span>★ = difference statistically supported after adjustment</span></div>${s}
<details><summary>Table view</summary><div class="wrap"><table><thead><tr><th>Service</th><th class="num">Weaker</th><th class="num">Stronger</th><th class="num">Diff (pp)</th><th class="num">p (exact)</th><th class="num">q (BH)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label_en)}</td><td class="num">${pct(r.weaker_mean)}</td><td class="num">${pct(r.stronger_mean)}</td><td class="num">${num(r.diff_pp,1)}</td><td class="num">${r.p_exact}</td><td class="num">${r.q_bh}</td></tr>`).join('')}</tbody></table></div></details>`}
function brief(){const g=D.group_comparison,sup=g.status==='ok'?g.services.filter(s=>s.supported).length:null;const hc=D.hypothesis_conclusion||{};const high=D.service_priority.filter(c=>c.class==='high_priority');const p=(D.commercial_context||{}).primary||{};
const title=g.status!=='ok'?'Not enough data to compare weaker and stronger sales positions':sup===0?`Weaker-selling districts are not measurably more dissatisfied: 0 of ${g.services.length} services differ`:`${sup} of ${g.services.length} services show higher dissatisfaction in weaker-selling districts`;
$('v-brief').innerHTML=`<div class="kpis"><div class="kpi"><div class="l">Respondents in view</div><div class="v">${D.respondents_in_filter}</div><div class="n">${D.districts_in_filter.length} districts · eligible, valid</div></div>
<div class="kpi"><div class="l">High-priority services</div><div class="v">${high.length}</div><div class="n">${high.map(h=>esc(h.label_en)).join(', ')||'none meets all criteria'}</div></div>
<div class="kpi"><div class="l">Services differing by sales position</div><div class="v">${sup==null?'n/a':sup+' / '+g.services.length}</div><div class="n">district-level exact test, adjusted</div></div>
<div class="kpi"><div class="l">Dissatisfaction vs sell-through</div><div class="v">${p.rho==null?'n/a':'ρ '+num(p.rho)}</div><div class="n">p ${p.p_permutation??'n/a'} · n=${(D.commercial_context||{}).n_districts||0} districts</div></div></div>
<div class="card"><h2>${esc(title)}</h2><p class="sub">Share of residents rating each service 1–2 (dissatisfied), averaged over districts in each sales-position group. ${esc(D.sales_position.rule)}</p>${dumbbell()}</div>
<div class="card"><h2>What this means</h2><p class="sub">Observation = what the data shows · Interpretation = what it may suggest · Decision = what to consider</p><div class="ins">${D.insights.map(i=>`<div class="${i.level}"><span class="t">${i.level}</span>${esc(i.text)}</div>`).join('')}</div></div>
<div class="card"><h2>Evidence verdict: ${esc((hc.label||'').replace(/_/g,' '))}</h2><p class="sub">${esc(hc.text||'')}</p><ul>${(hc.basis||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`}
/* VIEW 2 */
function land(){const m=D.area_service_matrix,pts=Object.fromEntries((D.district_points||[]).map(p=>[p.district_id,p]));const svcs=D.satisfaction_by_service.slice().sort((a,b)=>(b.bottom_box||0)-(a.bottom_box||0));const ds=[...new Set(m.map(r=>r.district_id))].sort((a,b)=>(pts[a]?.sell_through_pct??0)-(pts[b]?.sell_through_pct??0));
const w=svcs.slice(0,2),s=svcs.slice(-2);
const title=svcs.length?`${w.map(x=>x.label_en).join(' and ')} draw the most dissatisfaction; ${s.map(x=>x.label_en).join(' and ')} the least`:'No data';
const cell=(d,k)=>m.find(r=>r.district_id===d&&r.service===k);
$('v-land').innerHTML=`<div class="card"><h2>${esc(title)}</h2><p class="sub">Dissatisfied share (rating 1–2) by area and service in the current view. Rows ordered by sell-through (lowest first). Marker = evidence grade: ● strong descriptive · ◐ consistent but limited · ○ preliminary · △ survey and independent indicator disagree. Hover for n, interval and comparison with other areas.</p>
${ds.length?`<div class="wrap"><table class="heat"><thead><tr><th>Area</th><th>Sell-through</th>${svcs.map(x=>`<th>${esc(x.label_en)}</th>`).join('')}</tr></thead><tbody>${ds.map(d=>`<tr><td style="text-align:left"><b>${esc(d)}</b> <span class="small">${pts[d]?.sales_position||''}</span></td><td>${pts[d]?.sell_through_pct==null?'n/a':num(pts[d].sell_through_pct,1)+'%'}</td>${svcs.map(x=>{const c=cell(d,x.service);if(!c||c.bottom_box==null)return '<td>n/a</td>';const [bg,fg]=rampColor(c.bottom_box);const dim=!svcOK(x.service)?'opacity:.35;':'';
const tt=`<b>${esc(d)} · ${esc(x.label_en)}</b><br>Dissatisfied ${pct(c.bottom_box)} (95% CI ${ci(c.bottom_box_ci95)}), n=${c.n_valid}<br>Other areas ${pct(c.rest_bottom_box)}; difference ${c.diff_vs_rest==null?'n/a':(c.diff_vs_rest*100).toFixed(1)+' pp'}, adjusted q ${c.q_bh}<br>Importance ${num(c.importance_mean)} · Mean gap ${num(c.gap_mean)}<br>Independent indicator: ${esc(c.independent.status.replace(/_/g,' '))}${c.independent.value!=null?' ('+c.independent.value+')':''}<br>Grade: ${esc(GRADE[c.evidence_grade]||c.evidence_grade)}`;
return `<td ${T(tt)} style="background:${bg};color:${fg};${dim}">${pct(c.bottom_box)} ${MARK[c.evidence_grade]||''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No areas match the current filters.</div>'}</div>
<div class="card"><h2>Service summary for the current view</h2><p class="sub">Denominator: respondents with a valid answer for the service. Missing rate = unanswered share of all respondents in view. Not-applicable cannot be measured: the questionnaire has no such option.</p><div class="wrap"><table><thead><tr><th>Service</th><th class="num">Valid n</th><th class="num">Dissatisfied (95% CI)</th><th class="num">Satisfied</th><th class="num">Mean rating</th><th class="num">Importance</th><th class="num">Missing</th></tr></thead><tbody>${svcs.filter(x=>svcOK(x.service)).map(x=>`<tr><td>${esc(x.label_en)}</td><td class="num">${x.n_valid}</td><td class="num">${pct(x.bottom_box)} (${ci(x.bottom_box_ci95)})</td><td class="num">${pct(x.top_box)}</td><td class="num">${num(x.current_mean)}</td><td class="num">${num(x.importance_mean)}</td><td class="num">${pct1(x.missing_rate)}</td></tr>`).join('')}</tbody></table></div>
<p class="small">Overall area quality (q13, 1–5): mean ${num(D.overall_quality.q13_mean)}, rated 4–5 by ${pct(D.overall_quality.q13_top_box.share)} and 1–2 by ${pct(D.overall_quality.q13_bottom_box.share)} (n=${D.overall_quality.q13_n}); would recommend the area: ${pct(D.overall_quality.q14_recommend_yes.share)}.</p></div>`}
/* VIEW 3 */
function pain(){const p=D.pain_points.slice().sort((a,b)=>(b.prevalence_q4.share||0)-(a.prevalence_q4.share||0));const top=p[0];const sev=D.pain_points.filter(x=>x.severe_among_main.n>=15).sort((a,b)=>(b.severe_among_main.share||0)-(a.severe_among_main.share||0))[0];
const bar=(sh,c)=>{const v=sh.share;return v==null?'<span class="small">n/a</span>':`<div ${T(`${sh.k} of ${sh.n} (${pct(v)}), 95% CI ${ci(sh.ci95)}`)} style="display:flex;align-items:center;gap:6px"><div style="height:10px;border-radius:0 4px 4px 0;background:${c};width:${Math.max(2,v*160)}px"></div><span>${pct(v)}</span><span class="small">n=${sh.n}</span></div>`};
const title=top?`${top.label_en} is the most widespread problem (${pct(top.prevalence_q4.share)} of residents); ${sev?sev.label_en+' is the most severe among those it affects most':'severity needs larger samples'}`:'No data';
const svc=$('fSvc').value||(top&&top.service);const byD=D.pain_points_by_district||{};
$('v-pain').innerHTML=`<div class="card"><h2>${esc(title)}</h2><p class="sub">Widespread (problem reported in the last 90 days) and severe (large or very large impact among residents whose main problem it is) are different measures and are shown side by side. Shares use their own denominators; q4 is multi-select so prevalence does not sum to 100%.</p>
<div class="wrap"><table><thead><tr><th>Service</th><th>Reported a problem (q4)</th><th class="num">Residents affected</th><th>Named as main problem (q5)</th><th>Severe among main-problem group</th><th>Frequent (daily or often)</th></tr></thead><tbody>${p.filter(x=>svcOK(x.service)).map(x=>`<tr><td>${esc(x.label_en)}</td><td>${bar(x.prevalence_q4,'var(--s-strong)')}</td><td class="num">${x.affected_respondents}</td><td>${bar(x.main_problem_q5,'var(--r300)')}</td><td>${bar(x.severe_among_main,'var(--s-weak)')}</td><td>${bar(x.frequent_among_main,'var(--r500)')}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><h2>${esc(svcLabel(svc))}: where residents report it</h2><p class="sub">Share of each area's respondents reporting a problem with this service (denominator = valid q4 answers in that area). Choose another service with the Service focus filter.</p><div class="wrap"><table><thead><tr><th>Area</th><th>Reported a problem</th><th class="num">Affected</th><th class="num">Respondents</th></tr></thead><tbody>${Object.keys(byD).sort().map(d=>{const x=byD[d].find(y=>y.service===svc);return x?`<tr><td>${esc(d)}</td><td>${bar(x.prevalence_q4,'var(--s-strong)')}</td><td class="num">${x.prevalence_q4.k}</td><td class="num">${x.prevalence_q4.n}</td></tr>`:''}).join('')||'<tr><td colspan="4" class="empty">No areas in view.</td></tr>'}</tbody></table></div></div>`}
/* VIEW 4 */
function scatter(){const pts=(D.district_points||[]).filter(p=>p.dissatisfaction_index!=null&&p.sell_through_pct!=null);if(pts.length<3)return '<div class="empty">Not enough districts with both survey and sales data.</div>';
const W=560,H=300,L=52,B=36,T0=12,R=14;const xs=pts.map(p=>p.dissatisfaction_index),ys=pts.map(p=>p.sell_through_pct);const x0=Math.min(...xs)-.02,x1=Math.max(...xs)+.02,y0=Math.floor(Math.min(...ys)/10)*10-5,y1=100;const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>H-B-(v-y0)/(y1-y0)*(H-B-T0);
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="District dissatisfaction index versus sell-through">`;
for(let t=Math.ceil(y0/10)*10;t<=100;t+=10)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}%</text>`;
for(let t=Math.ceil(x0*20)/20;t<=x1;t+=.05)s+=`<text x="${X(t)}" y="${H-B+16}" text-anchor="middle">${Math.round(t*100)}%</text>`;
s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">District dissatisfaction index (mean dissatisfied share across services)</text><text transform="translate(12 ${(H-B)/2}) rotate(-90)" text-anchor="middle">Sell-through</text>`;
pts.forEach(p=>{const c=p.sales_position==='weaker'?'var(--s-weak)':'var(--s-strong)';s+=`<g ${T(`<b>${esc(p.district_id)}</b> (${esc(p.sales_position||'unclassified')})<br>Dissatisfaction index ${pct(p.dissatisfaction_index)}<br>Sell-through ${num(p.sell_through_pct,1)}%<br>Respondents ${p.respondents}<br>Stage: ${esc(p.lifecycle||'n/a')}`)}><circle cx="${X(p.dissatisfaction_index)}" cy="${Y(p.sell_through_pct)}" r="7" fill="${c}" stroke="var(--surface)" stroke-width="2"/><text x="${X(p.dissatisfaction_index)+10}" y="${Y(p.sell_through_pct)+4}">${esc(p.district_id)}</text></g>`});
return s+'</svg>'}
function test(){const hc=D.hypothesis_conclusion||{},g=D.group_comparison,cc=D.commercial_context||{},cs=D.contradictory_districts||{},lc=D.sales_position.lifecycle_comparability||{};const pr=cc.primary||{};
$('v-test').innerHTML=`<div class="card"><h2>Does the evidence connect service quality with weak sales? ${esc((hc.label||'').replace(/_/g,' '))}</h2><p class="sub">${esc(hc.text||'')}</p><ul>${(hc.basis||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul><p class="small">No causal claim is made. Unit of analysis is the district because respondents are nested in districts; with ${(cc.n_districts||0)} districts power is low and no confidence interval can be reliably reported.</p></div>
<div class="two"><div class="card"><h2>Dissatisfaction versus sell-through by district</h2><p class="sub">${esc(pr.direction||'')}${pr.rho!=null?` (Spearman ρ ${num(pr.rho)}, permutation p ${pr.p_permutation})`:''}</p><div class="legend"><span><i class="dot" style="background:var(--s-weak)"></i>Weaker</span><span><i class="dot" style="background:var(--s-strong)"></i>Stronger</span></div>${scatter()}</div>
<div class="card"><h2>Districts that do not follow the pattern</h2><p class="sub">${esc(cs.reading||'')}</p>${(cs.cases||[]).length?`<table><thead><tr><th>Area</th><th>Case</th><th class="num">Sell-through</th><th class="num">Dissat. index</th></tr></thead><tbody>${cs.cases.map(c=>`<tr><td>${esc(c.district_id)}</td><td>${esc(c.kind)}</td><td class="num">${num(c.sell_through_pct,1)}%</td><td class="num">${pct(c.dissatisfaction_index)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">None found, or insufficient data.</div>'}</div></div>
<div class="card"><h2>Weaker versus stronger sales position, by service</h2><p class="sub">${esc(g.method||g.reason||'')}. Smallest p possible with this grouping: ${g.min_possible_p??'n/a'}. Effect size = rank-biserial (−1 to 1; positive = weaker districts more dissatisfied).</p>${g.status==='ok'?`<div class="wrap"><table><thead><tr><th>Service</th><th class="num">Weaker</th><th class="num">Stronger</th><th class="num">Diff (pp)</th><th class="num">Effect</th><th class="num">p</th><th class="num">q (BH)</th><th>Result</th></tr></thead><tbody>${g.services.filter(s=>svcOK(s.service)).map(s=>`<tr><td>${esc(s.label_en)}</td><td class="num">${pct(s.weaker_mean)}</td><td class="num">${pct(s.stronger_mean)}</td><td class="num">${num(s.diff_pp,1)}</td><td class="num">${num(s.rank_biserial)}</td><td class="num">${s.p_exact}</td><td class="num">${s.q_bh}</td><td>${s.supported?'Supported':'Not supported'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Needs at least 3 districts per group.</div>'}</div>
<div class="two"><div class="card"><h2>Other factors that could explain sell-through</h2><p class="sub">Spearman ρ against sell-through, same 10 districts. Exploratory, adjusted across ${((cc.alternative_explanations_same_outcome||[]).length+1)} correlations.</p><table><thead><tr><th>Factor</th><th class="num">ρ</th><th class="num">q</th></tr></thead><tbody>${(cc.alternative_explanations_same_outcome||[]).map(a=>`<tr><td>${esc(a.factor)}</td><td class="num">${num(a.rho)}</td><td class="num">${a.q_bh_over_5_correlations}</td></tr>`).join('')}</tbody></table><p class="small">Not testable with current data: ${esc((cc.excluded_factors_no_data||[]).join(', '))}.</p></div>
<div class="card"><h2>Is the comparison fair?</h2><p class="sub">${esc(lc.note||'')}</p>${lc.confounded?`<p><b>Not like-for-like:</b> ${esc((lc.archetypes_in_one_group_only||[]).join(', '))} appear in only one group.</p>`:'<p>Groups overlap on development stage.</p>'}<table><tbody>${Object.entries(lc.table||{}).map(([a,r])=>`<tr><td>${esc(a)}</td><td>weaker ${r.weaker||0}</td><td>stronger ${r.stronger||0}</td></tr>`).join('')}</tbody></table></div></div>`}
/* VIEW 5 */
function act(){const sp=D.service_priority.filter(c=>svcOK(c.service));const rows=D.recommended_actions.filter(a=>!a.service||svcOK(a.service));
$('v-act').innerHTML=`<div class="card"><h2>${D.service_priority.filter(c=>c.class==='high_priority').length} high-priority, ${D.service_priority.filter(c=>c.class==='medium_priority').length} medium-priority services; actions are investigations, not investments</h2><p class="sub">Class rules are in Methodology. Classes depend on thresholds: ${(Object.keys(D.priority_sensitivity.unstable_services).length)} of ${D.service_priority.length} services change class under reasonable alternative thresholds (${esc(Object.keys(D.priority_sensitivity.unstable_services).map(svcLabel).join(', ')||'none')}).</p>
<div class="wrap"><table><thead><tr><th>Service</th><th>Priority</th><th class="num">Dissatisfied (CI)</th><th class="num">Severe</th><th>Link to weaker sales</th><th>Why</th></tr></thead><tbody>${sp.map(c=>`<tr><td>${esc(c.label_en)}</td><td>${pill(c.class)}</td><td class="num">${pct(c.bottom_box)} (${ci(c.bottom_box_ci95)})</td><td class="num">${pct(c.severe_among_main.share)} (n=${c.severe_among_main.n})</td><td>${esc(c.weak_sales_relevance.replace(/_/g,' '))}</td><td style="white-space:normal;min-width:240px">${esc(c.reason)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><h2>Decision table</h2><p class="sub">Each row traces: issue → area → supporting metric → evidence grade → action. Affected = respondents rating the service 1–2 in the listed areas.</p><div class="wrap"><table><thead><tr><th>Area</th><th>Service</th><th>Problem</th><th>Supporting evidence</th><th class="num">Affected</th><th>Priority</th><th>Confidence</th><th>Recommended action</th><th>Next step</th></tr></thead><tbody>${rows.map(a=>{const e=a.evidence.pooled_dissatisfied;return `<tr><td style="white-space:normal;min-width:90px">${esc(a.areas.join(', '))}</td><td>${esc(a.service?svcLabel(a.service):'Outside service scope')}</td><td style="white-space:normal;min-width:180px">${esc(a.problem)}</td><td style="white-space:normal;min-width:170px">${e?`${pct(e.share)} dissatisfied (CI ${ci(e.ci95)}), n=${e.n}`:'Services do not separate these areas'}; ${a.evidence.supports_finding_ids.length} finding(s)</td><td class="num">${e?e.k:'n/a'}</td><td>${pill(a.priority_class)}</td><td>${esc(GRADE[a.confidence]||a.confidence)}</td><td style="white-space:normal;min-width:170px"><b>${esc(ACT[a.action]||a.action)}</b><br><span class="small">${esc(a.reason)}</span></td><td style="white-space:normal;min-width:200px">${esc(a.next_step)}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No actions for the current filters.</td></tr>'}</tbody></table></div></div>`}
/* VIEW 6 */
function meth(){const dq=D.data_quality||{};
$('v-meth').innerHTML=`<div class="card"><h2>Is the analysis ready? Readiness assessment</h2><div class="wrap"><table><thead><tr><th>Question</th><th>Answer</th><th>Why</th></tr></thead><tbody>${D.readiness.map(r=>`<tr><td>${esc(r.question)}</td><td><b>${esc(r.answer)}</b></td><td style="white-space:normal">${esc(r.why)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><h2>Data and sample</h2><p class="sub">Source: synthetic survey (${dq.rows_received} rows; ${dq.ineligible_screened_out} screened out; ${dq.eligible_clean_rows} eligible, clean) linked by District_ID and Project_ID to the sales tables. Excluded rows are counted, never silently dropped: ${esc(JSON.stringify(dq.excluded||{}))}. Invalid ratings set to missing: ${dq.invalid_rating_values_set_to_null}. Missing ratings are never imputed.</p><p class="small">${esc(D.sales_position.rule)} No official weak-sales classification or sales target was found in the repository.</p></div>
<div class="card"><h2>Priority rules</h2><ul><li><b>High priority:</b> dissatisfied share CI lower bound ≥ ${pct(D.parameters.bottom_box_threshold)}, mean importance ≥ ${D.parameters.importance_high}, severe share among the main-problem group ≥ ${pct(D.parameters.severe_share_high)} (n ≥ 15), and not contradicted by the independent availability indicator.</li><li><b>Further investigation required:</b> same survey signal, but the independent indicator mostly shows the service as relatively available.</li><li><b>Medium priority:</b> dissatisfied share at or above the threshold without all criteria.</li><li><b>Monitor:</b> below threshold (not proof of adequacy).</li></ul><p class="small">No weighted score is used. Thresholds are management decision rules, not estimates; sensitivity is shown on the Management actions view.</p></div>
<div class="card"><h2>Metric contract</h2><div class="wrap"><table><thead><tr><th>Metric</th><th>Formula</th><th>Denominator</th><th>Filter behaviour</th><th>Null handling</th></tr></thead><tbody>${D.metric_contract.map(m=>`<tr><td><b>${esc(m.name)}</b><br><span class="small">${esc(m.meaning)}</span></td><td style="white-space:normal">${esc(m.formula)}</td><td style="white-space:normal">${esc(m.denominator)}</td><td style="white-space:normal">${esc(m.filter_behavior)}</td><td style="white-space:normal">${esc(m.null_handling)}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card"><h2>Missing data and limitations</h2><ul>${D.missing_data.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><ul>${D.limitations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
load();
</script></body></html>
